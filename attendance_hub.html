<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>差勤紀錄 - 校園點名系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="attendance_hub.css">
</head>
<body>

<div class="page-backdrop" aria-hidden="true"></div>

<main class="hub-wrapper">
    <section class="orbit-section">
        <div class="orbit-stage" id="orbitStage">
            <!-- 正中央：差勤紀錄核心菱形 -->
            <button type="button" class="center-diamond" id="centerDiamond" onclick="enterActiveModule()" title="點擊進入目前選取的功能">
                <div class="center-inner">
                    <span class="center-icon">📋</span>
                    <span class="center-label">差勤紀錄</span>
                    <span class="center-current" id="centerCurrentLabel">請假登記</span>
                </div>
            </button>

            <!-- 2 顆差勤業務衛星菱形 -->
            <div id="orbitSatellites"></div>
        </div>

        <div class="orbit-footer">
            <p class="active-module-desc" id="activeModuleDesc">幫學生事前登記請假，即時同步至各節次點名表與操作紀錄</p>

            <div class="active-control-row">
                <button type="button" class="step-arrow" onclick="stepOrbit(-1)" aria-label="上一個功能">◀</button>
                <button type="button" class="btn-enter-module" onclick="enterActiveModule()">
                    <span class="enter-prefix">進入</span>
                    <strong id="activeModuleName">請假登記</strong>
                    <span class="enter-arrow">➔</span>
                </button>
                <button type="button" class="step-arrow" onclick="stepOrbit(1)" aria-label="下一個功能">▶</button>
            </div>

            <div class="footer-subrow">
                <a href="index.html" class="btn-lobby-link">🏠 返回系統大廳</a>
                <span class="hint-sep">｜</span>
                <span class="orbit-hint">滑動、滾輪或方向鍵切換功能</span>
            </div>
        </div>
    </section>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script src="navbar.js"></script>
<script src="auth_guard.js" data-role="teacher"></script>
<script src="attendance_hub.js"></script>
</body>
</html>
