<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石榴科技實驗學校 線上點名系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<main class="hero">
    <div class="hero-header">
        <div class="hero-kicker">SHILIU TECHNOLOGY EXPERIMENTAL SCHOOL</div>
        <h1 class="school-name">石榴科技實驗學校</h1>
        <div class="title-divider">
            <span class="divider-line"></span>
            <span class="divider-diamond"></span>
            <span class="system-title">線上點名系統</span>
            <span class="divider-diamond"></span>
            <span class="divider-line"></span>
        </div>
    </div>

    <div class="portal-card">
        <!-- 畫面 0：載入中 -->
        <div id="viewLoading" class="loading-box">⏳ 正在驗證登入狀態...</div>

        <!-- 畫面 1：未登入 -->
        <div id="viewLogin" style="display:none;">
            <p class="panel-hint">請使用 Google (Gmail) 帳號登入系統</p>
            <button onclick="loginWithGoogle()" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G">
                使用 Google 帳號登入
            </button>
        </div>

        <!-- 畫面 2：首次登入填寫註冊資料 -->
        <div id="viewRegister" style="display:none;">
            <p class="form-title">首次使用，請填寫帳號申請資料</p>
            <div class="form-group">
                <label>Google 信箱</label>
                <input type="text" id="regEmail" disabled>
            </div>
            <div class="form-group">
                <label>登記人員姓名（請填寫真實姓名）</label>
                <input type="text" id="regName" placeholder="例如：王小明">
            </div>
            <div class="form-group">
                <label>希望申請身分</label>
                <select id="regRole">
                    <option value="teacher">👩‍🏫 教師（僅使用教師點名端）</option>
                    <option value="admin">🛡️ 後台管理人員 / 行政（開放點名與行政後台）</option>
                </select>
            </div>
            <button onclick="submitRegistration()" class="btn-submit">送出申請</button>
        </div>

        <!-- 畫面 3：等待行政審核中 -->
        <div id="viewPending" style="display:none;">
            <div class="status-box">
                <div class="status-icon">⏳</div>
                <b>帳號審核中</b><br>
                您的申請資料已送出，請聯繫行政人員於後台點擊「核准」後，重新整理此頁面即可進入系統。
            </div>
        </div>

        <!-- 畫面 4：審核通過，顯示大廳三入口 -->
        <div id="viewLobby" style="display:none;">
            <div class="btn-group">
                <a href="teacher.html" class="entry-btn btn-teacher">
                    <div class="entry-content">
                        <span class="entry-icon">👩‍🏫</span>
                        <span class="entry-label">教師點名</span>
                        <span class="entry-sub">各班課程點名</span>
                    </div>
                </a>

                <div class="diamond-sep" aria-hidden="true">
                    <span class="sep-line"></span>
                    <span class="sep-dot"></span>
                    <span class="sep-line"></span>
                </div>

                <a href="attendance_hub.html" class="entry-btn btn-leave">
                    <div class="entry-content">
                        <span class="entry-icon">📋</span>
                        <span class="entry-label">差勤紀錄</span>
                        <span class="entry-sub">請假與個人查詢</span>
                    </div>
                </a>

                <div class="diamond-sep" aria-hidden="true">
                    <span class="sep-line"></span>
                    <span class="sep-dot"></span>
                    <span class="sep-line"></span>
                </div>

                <a href="admin_index.html" id="btnAdminEntry" class="entry-btn btn-admin">
                    <div class="entry-content">
                        <span class="lock-badge" id="adminLockBadge" style="display:none;">🚫 無權限</span>
                        <span class="entry-icon" id="adminIcon">🛡️</span>
                        <span class="entry-label">行政後端</span>
                        <span class="entry-sub">巡堂與資料管理</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script src="navbar.js"></script>
<script src="index.js"></script>
</body>
</html>
