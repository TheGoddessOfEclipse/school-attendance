<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石榴科技實驗學校 線上點名系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f4f7f6 0%, #e2ebf0 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; width: 100%; max-width: 540px; padding: 44px 36px;
            border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); text-align: center;
        }
        .school-name { font-size: 28px; font-weight: 800; color: #2c3e50; letter-spacing: 2px; margin-bottom: 6px; }
        .system-title { font-size: 18px; font-weight: 600; color: #7f8c8d; letter-spacing: 3px; margin-bottom: 32px; }

        /* 登入按鈕 */
        .btn-google {
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            background: #fff; color: #444; border: 1px solid #ddd; padding: 14px 28px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: 0.2s; width: 100%; max-width: 300px;
        }
        .btn-google:hover { background: #f8f9fa; box-shadow: 0 4px 10px rgba(0,0,0,0.12); }

        /* 註冊表單 */
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; color: #34495e; margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
        }
        .btn-submit {
            width: 100%; padding: 12px; background: #2980b9; color: #fff; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .btn-submit:hover { background: #2471a3; }

        /* 雙入口按鈕 */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .entry-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #fff; padding: 30px 16px; border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .entry-btn:hover:not(.locked) { transform: translateY(-4px); box-shadow: 0 10px 22px rgba(0,0,0,0.16); }
        .btn-teacher { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-admin { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        /* 教師帳號封鎖樣式 */
        .entry-btn.locked {
            background: #bdc3c7 !important; color: #7f8c8d !important;
            cursor: not-allowed; pointer-events: none; box-shadow: none; filter: grayscale(100%);
        }
        .lock-badge {
            position: absolute; top: 10px; right: 10px; background: #e74c3c; color: #fff;
            font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px;
        }
        .entry-icon { font-size: 40px; margin-bottom: 10px; }
        .entry-label { font-size: 19px; font-weight: bold; }

        .user-bar {
            margin-top: 28px; padding-top: 16px; border-top: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7f8c8d;
        }
        .btn-logout {
            background: none; border: 1px solid #ccc; color: #555; padding: 5px 12px;
            border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-logout:hover { background: #f0f0f0; }
        .status-box { padding: 20px; border-radius: 10px; background: #fef9e7; border: 1px solid #f9e79f; color: #9a7d0a; line-height: 1.6; }

        @media (max-width: 500px) { .btn-group { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="card">
    <div class="school-name">石榴科技實驗學校</div>
    <div class="system-title">線上點名系統</div>

    <!-- 畫面 0：載入中 -->
    <div id="viewLoading" style="color:#7f8c8d; padding:20px;">⏳ 正在驗證登入狀態...</div>

    <!-- 畫面 1：未登入 -->
    <div id="viewLogin" style="display:none;">
        <p style="color:#555; margin-bottom:24px; font-size:15px;">請使用 Google (Gmail) 帳號登入系統</p>
        <button onclick="loginWithGoogle()" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22" alt="G">
            使用 Google 帳號登入
        </button>
    </div>

    <!-- 畫面 2：首次登入填寫註冊資料 -->
    <div id="viewRegister" style="display:none;">
        <p style="color:#2c3e50; font-weight:bold; margin-bottom:18px;">首次使用，請填寫帳號申請資料</p>
        <div class="form-group">
            <label>Google 信箱</label>
            <input type="text" id="regEmail" disabled style="background:#f4f4f4; color:#777;">
        </div>
        <div class="form-group">
            <label>登記人員姓名（請填寫真實姓名）</label>
            <input type="text" id="regName" placeholder="例如：王小明">
        </div>
        <div class="form-group">
            <label>希望申請身分</label>
            <select id="regRole">
                <option value="teacher">👩‍🏫 教師（僅使用教師點名端）</option>
                <option value="admin">🛡️ 後台管理人員 / 行政（開放點名與行政後台）</option>
            </select>
        </div>
        <button onclick="submitRegistration()" class="btn-submit">送出申請</button>
    </div>

    <!-- 畫面 3：等待行政審核中 -->
    <div id="viewPending" style="display:none;">
        <div class="status-box">
            <div style="font-size:32px; margin-bottom:8px;">⏳</div>
            <b>帳號審核中</b><br>
            您的申請資料已送出，請聯繫行政人員於後台點擊「核准」後，重新整理此頁面即可進入系統。
        </div>
    </div>

    <!-- 畫面 4：審核通過，顯示大廳雙入口 -->
    <div id="viewLobby" style="display:none;">
        <div class="btn-group">
            <a href="teacher.html" class="entry-btn btn-teacher">
                <span class="entry-icon">👩‍🏫</span>
                <span class="entry-label">教師點名</span>
            </a>

            <a href="admin_index.html" id="btnAdminEntry" class="entry-btn btn-admin">
                <span class="lock-badge" id="adminLockBadge" style="display:none;">🚫 無權限</span>
                <span class="entry-icon" id="adminIcon">🛡️</span>
                <span class="entry-label">行政後端</span>
            </a>
        </div>
    </div>

    <!-- 底部使用者資訊列 -->
    <div id="userBar" class="user-bar" style="display:none;">
        <span id="userInfoText"></span>
        <button onclick="logout()" class="btn-logout">登出</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script>
    let currentUser = null;

    function showView(viewId) {
        ['viewLoading', 'viewLogin', 'viewRegister', 'viewPending', 'viewLobby'].forEach(id => {
            document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
        });
    }

    // 監聽登入狀態
    firebase.auth().onAuthStateChanged(async (user) => {
        currentUser = user;
        if (!user) {
            document.getElementById('userBar').style.display = 'none';
            showView('viewLogin');
            return;
        }

        document.getElementById('userBar').style.display = 'flex';
        const snap = await window.db.ref(`users/${user.uid}`).once('value');
        const profile = snap.val();

        if (!profile) {
            // 尚未註冊
            document.getElementById('regEmail').value = user.email;
            document.getElementById('regName').value = user.displayName || '';
            document.getElementById('userInfoText').innerText = user.email;
            showView('viewRegister');
            return;
        }

        const roleLabel = profile.role === 'admin' ? '行政管理員' : '教師';
        document.getElementById('userInfoText').innerText = `${profile.name} (${roleLabel})`;

        if (profile.status === 'pending') {
            showView('viewPending');
        } else if (profile.status === 'approved') {
            // 設定行政按鈕權限
            const btnAdmin = document.getElementById('btnAdminEntry');
            const lockBadge = document.getElementById('adminLockBadge');
            const adminIcon = document.getElementById('adminIcon');

            if (profile.role === 'admin') {
                btnAdmin.classList.remove('locked');
                btnAdmin.setAttribute('href', 'admin_index.html');
                lockBadge.style.display = 'none';
                adminIcon.innerText = '🛡️';
            } else {
                btnAdmin.classList.add('locked');
                btnAdmin.removeAttribute('href');
                lockBadge.style.display = 'inline-block';
                adminIcon.innerText = '🔒';
            }
            showView('viewLobby');
        } else {
            alert("您的帳號申請未通過或已被停權，請聯繫行政人員。");
            logout();
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).catch(err => {
            alert("登入失敗：" + err.message);
        });
    }

    async function submitRegistration() {
        const name = document.getElementById('regName').value.trim();
        const role = document.getElementById('regRole').value;
        if (!name) return alert("請填寫您的真實姓名！");

        await window.db.ref(`users/${currentUser.uid}`).set({
            uid: currentUser.uid,
            email: currentUser.email,
            name: name,
            role: role,
            status: 'pending',
            createdAt: Date.now()
        });
        showView('viewPending');
    }

    function logout() {
        firebase.auth().signOut();
    }
</script>
</body>
</html>
