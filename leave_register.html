<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生請假登記 - 石榴科技實驗學校</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manage_students.css">
    <style>
        .container { max-width: 860px; }
        .form-section {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(212, 180, 117, 0.22);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 16px;
            font-weight: 700;
            color: #ebd29b;
            letter-spacing: 1px;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .selected-student-card {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 9px;
            background: linear-gradient(135deg, rgba(212, 180, 117, 0.16), rgba(30, 42, 38, 0.85));
            border: 1px solid rgba(212, 180, 117, 0.55);
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 10px;
        }
        .check-chip {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(10, 15, 18, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.14);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.18s ease;
        }
        .check-chip:hover {
            border-color: #d4b475;
            background: rgba(212, 180, 117, 0.12);
        }
        .check-chip small {
            display: block;
            font-size: 11px;
            color: #aeb9b6;
        }
        .leave-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .leave-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 14px 8px;
            border-radius: 10px;
            background: rgba(10, 15, 18, 0.72);
            border: 1px solid rgba(212, 180, 117, 0.3);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .leave-btn:hover,
        .leave-btn.active {
            background: linear-gradient(145deg, rgba(241, 196, 15, 0.34), rgba(84, 62, 14, 0.92));
            border-color: #ebd29b;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(241, 196, 15, 0.22);
        }
        .leave-btn span:first-child { font-size: 24px; }
        .quick-btn {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid rgba(212, 180, 117, 0.45);
            background: rgba(212, 180, 117, 0.14);
            color: #ebd29b;
            cursor: pointer;
        }
        .quick-btn:hover { background: rgba(212, 180, 117, 0.28); }
        .submit-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        @media (max-width: 600px) {
            .leave-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="btn-back">⬅ 返回大廳</a>
        <h2>📝 學生請假登記</h2>
    </div>

    <!-- 步驟 1：選擇請假學生 -->
    <div class="form-section">
        <h3 class="section-title">1. 選擇請假學生</h3>
        <div style="position: relative;">
            <input type="text" id="stuSearchInput" placeholder="🔍 輸入學號、姓名或班級（例：701、王小明）..." autocomplete="off" style="width: 100%;">
            <div id="stuSearchDropdown" class="autocomplete-items" style="display:none;"></div>
        </div>
        <div id="selectedStudentCard" class="selected-student-card">
            <div>
                <span id="selStuNum" class="badge-num" style="margin-right: 8px;"></span>
                <strong id="selStuName" style="font-size: 16px;"></strong>
                <span id="selStuHome" class="badge-class" style="margin-left: 8px;"></span>
            </div>
            <button type="button" class="quick-btn" onclick="clearSelectedStudent()">更換學生</button>
        </div>
    </div>

    <!-- 步驟 2：選擇請假日期與節次 -->
    <div class="form-section">
        <h3 class="section-title">
            <span>2. 選擇日期與請假節次</span>
            <span>
                <button type="button" class="quick-btn" onclick="toggleAllPeriods(true)">全選節次</button>
                <button type="button" class="quick-btn" onclick="toggleAllPeriods(false)">清除</button>
            </span>
        </h3>
        <div style="margin-bottom: 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <label style="color:#aeb9b6; font-size:14px;">請假日期：</label>
            <input type="date" id="leaveDateInput" onchange="renderPeriodsForDate()" style="max-width: 220px;">
        </div>
        <div id="periodCheckboxGrid" class="chip-grid">
            <div style="color:#aeb9b6; font-size:13px;">⏳ 載入節次中...</div>
        </div>
    </div>

    <!-- 步驟 3：選擇要請假的課程／班級 -->
    <div class="form-section">
        <h3 class="section-title">
            <span>3. 套用至該生所屬課程／班級</span>
            <span>
                <button type="button" class="quick-btn" onclick="toggleAllClasses(true)">全選班級</button>
                <button type="button" class="quick-btn" onclick="toggleAllClasses(false)">清除</button>
            </span>
        </h3>
        <div id="studentClassesGrid" class="chip-grid">
            <div style="color:#aeb9b6; font-size:13px;">請先於步驟 1 選擇學生，系統會自動帶出該生所有班級與社團。</div>
        </div>
    </div>

    <!-- 步驟 4：假別與備註 -->
    <div class="form-section">
        <h3 class="section-title">4. 選擇假別與填寫備註</h3>
        <div class="leave-grid">
            <button type="button" class="leave-btn active" data-type="病假" onclick="selectLeaveType('病假')">
                <span>🤒</span><span>病假</span>
            </button>
            <button type="button" class="leave-btn" data-type="事假" onclick="selectLeaveType('事假')">
                <span>📝</span><span>事假</span>
            </button>
            <button type="button" class="leave-btn" data-type="喪假" onclick="selectLeaveType('喪假')">
                <span>🕊️</span><span>喪假</span>
            </button>
            <button type="button" class="leave-btn" data-type="因故缺席" onclick="selectLeaveType('因故缺席')">
                <span>📌</span><span>因故缺席</span>
            </button>
        </div>

        <div id="reasonWrap" style="display:none; margin-bottom: 10px;">
            <input type="text" id="leaveReasonInput" placeholder="請輸入缺席原因（例：公假比賽、輔導室晤談）" style="width: 100%;">
        </div>
        <input type="text" id="leaveNoteInput" placeholder="備註事項（選填，例：家長已來電請假）" style="width: 100%;">
    </div>

    <div class="submit-bar">
        <button type="button" id="btnSubmitLeave" onclick="submitLeaveRegistration()" class="btn-add" style="padding: 12px 28px; font-size: 15px;">💾 送出請假登記</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script src="navbar.js"></script>
<script src="auth_guard.js" data-role="teacher"></script>
<script src="logger.js"></script>
<script src="leave_register.js"></script>
</body>
</html>
