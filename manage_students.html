<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生資料管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manage_students.css">
    <style>
        .container { max-width: 1400px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="admin_index.html" class="btn-back">⬅ 返回首頁</a>
        <h2>🧑‍🎓 學生資料管理（全校總檔）</h2>
        <a href="manage_classes.html" class="btn-back btn-nav-purple">前往班級管理 ➔</a>
    </div>

    <!-- 單筆新增與功能列 -->
    <div class="add-panel">
        <input type="text" id="newStuNumber" placeholder="學號(必填)" style="width: 115px; flex:none;">
        <input type="text" id="newStuName" placeholder="姓名(必填)" style="width: 115px; flex:none;">
        <select id="newStuHomeroom" style="width: 130px; flex:none;"></select>
        <input type="text" id="newStuSeat" placeholder="座號(例:01)" style="width: 100px; flex:none;">

        <button onclick="addMasterStudent()" class="btn-add">➕ 新增學生</button>
        <button onclick="openBulkModal()" class="btn-add btn-emerald">📊 批量匯入</button>
        <button onclick="bulkDeleteMasterStudents()" class="btn-add btn-crimson">🗑️ 批量刪除</button>
        <button onclick="upgradeAcademicYear()" class="btn-add btn-amber">🎓 學年自動升級</button>
    </div>

    <!-- 即時搜尋列 -->
    <div class="search-bar-row">
        <input type="text" id="searchInput" oninput="filterTable()" placeholder="🔍 搜尋學號、姓名、班級、校隊或社團...（點擊表格內各分類格子可直接多選修改）">
        <span id="totalCount" class="total-count-badge"></span>
    </div>

    <div class="table-container">
        <table>
            <thead id="studentTableHead"></thead>
            <tbody id="studentTableBody">
                <tr><td colspan="6">⏳ 載入全校學生資料中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 🌟 多選分類設定 Modal -->
<div id="multiSelectModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 420px;">
        <h3 id="multiModalTitle">設定分組</h3>
        <p class="modal-desc">可複選多個班級／社團，儲存後將即時同步至班級管理與點名系統：</p>
        <div id="multiCheckboxContainer" class="checkbox-list"></div>
        <div class="modal-actions">
            <button onclick="saveMultiSelect()" class="btn-add">💾 儲存變更</button>
            <button onclick="closeMultiModal()" class="btn-back">取消</button>
        </div>
    </div>
</div>

<!-- 🌟 批量匯入 Modal -->
<div id="bulkImportModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 520px;">
        <h3>📊 從 Excel 批量匯入全校學生</h3>
        <p class="modal-desc">
            請從 Excel 複製並貼上，欄位順序必須為：<br>
            <span class="modal-highlight">第一欄：原班級 ｜ 第二欄：姓名 ｜ 第三欄：座號 ｜ 第四欄：學號</span>
        </p>
        <textarea id="bulkTextarea" rows="10" placeholder="例：&#10;801&#9;王小明&#9;01&#9;1130001&#10;801&#9;陳小華&#9;02&#9;1130002" style="width: 100%; font-family: monospace;"></textarea>
        <div class="modal-actions">
            <button onclick="processBulkImport()" class="btn-add">解析並匯入</button>
            <button onclick="closeBulkModal()" class="btn-back">取消</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script src="navbar.js"></script>
<script src="auth_guard.js" data-role="admin"></script>
<script src="logger.js"></script>
<script src="manage_students.js"></script>
</body>
</html>
