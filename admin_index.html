<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行政端首頁 - 校園點名系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin_index.css">
</head>
<body>

<div class="page-backdrop" aria-hidden="true"></div>

<main class="admin-wrapper">
    <section class="orbit-section">
        <div class="orbit-stage" id="orbitStage">
            <!-- 正中央：行政後端核心菱形 -->
            <button type="button" class="center-diamond" id="centerDiamond" onclick="enterActiveModule()" title="點擊進入目前選取的功能">
                <div class="center-inner">
                    <span class="center-icon">🛡️</span>
                    <span class="center-label">行政後端</span>
                    <span class="center-current" id="centerCurrentLabel">出席狀況檢視</span>
                </div>
            </button>

            <!-- 5 顆行政業務衛星菱形（由 admin_index.js 動態生成與驅動） -->
            <div id="orbitSatellites"></div>
        </div>

        <!-- 底部鎖定業務說明與進入控制列 -->
        <div class="orbit-footer">
            <p class="active-module-desc" id="activeModuleDesc">巡堂座位表、檢視與修改每日點名狀況</p>

            <div class="active-control-row">
                <button type="button" class="step-arrow" onclick="stepOrbit(-1)" aria-label="上一個功能">◀</button>
                <button type="button" class="btn-enter-module" onclick="enterActiveModule()">
                    <span class="enter-prefix">進入</span>
                    <strong id="activeModuleName">出席狀況檢視</strong>
                    <span class="enter-arrow">➔</span>
                </button>
                <button type="button" class="step-arrow" onclick="stepOrbit(1)" aria-label="下一個功能">▶</button>
            </div>

            <div class="footer-subrow">
                <a href="index.html" class="btn-lobby-link">🏠 返回系統大廳</a>
                <span class="hint-sep">｜</span>
                <span class="orbit-hint">滑動、滾輪或方向鍵切換業務</span>
            </div>
        </div>
    </section>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase_config.js"></script>
<script src="navbar.js"></script>
<script src="auth_guard.js" data-role="admin"></script>
<script src="admin_index.js"></script>
</body>
</html>
